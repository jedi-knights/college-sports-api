version: '3'

vars:
  PACKAGE: github.com/jedi-knights/college-sports-api
  COVERAGE_FILE: coverage.out
  COVERAGE_HTML: coverage.html
  TEST_TAGS: unit
  IMAGE_NAME: ghcr.io/jedi-knights/college-sports-api
  COMPOSE_FILE: deploy/docker-compose.yml

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  test:
    desc: Run unit tests with race detector
    cmds:
      - go test -tags={{.TEST_TAGS}} ./... -race -count=1

  test-v:
    desc: Run unit tests verbosely with race detector
    cmds:
      - go test -tags={{.TEST_TAGS}} ./... -race -count=1 -v

  test-integration:
    desc: Run integration tests (hits real NCAA upstream)
    cmds:
      - go test -tags=integration ./... -race -count=1 -v

  cover:
    desc: Run tests with coverage profile and HTML report
    cmds:
      - go test -tags={{.TEST_TAGS}} ./... -coverprofile={{.COVERAGE_FILE}}
      - go tool cover -html={{.COVERAGE_FILE}} -o {{.COVERAGE_HTML}}
      - echo "Coverage report written to {{.COVERAGE_HTML}}"
    generates:
      - "{{.COVERAGE_FILE}}"
      - "{{.COVERAGE_HTML}}"

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  lint-fix:
    desc: Run golangci-lint with auto-fix
    cmds:
      - golangci-lint run --fix ./...

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  tidy:
    desc: Tidy and verify go.mod
    cmds:
      - go mod tidy
      - go mod verify

  openapi-check:
    desc: Lint the OpenAPI spec
    cmds:
      - npx --yes @redocly/cli@latest lint api/openapi/openapi.yaml

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f {{.COVERAGE_FILE}}
      - rm -f {{.COVERAGE_HTML}}
      - go clean ./...

  run:
    desc: Run the server against ./config/config.example.yaml
    cmds:
      - go run ./cmd/server serve --config=./config/config.example.yaml {{.CLI_ARGS}}

  dev:
    desc: Start the API + Redis in docker-compose for local development
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up --build

  dev-down:
    desc: Stop the local docker-compose stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down -v

  docker:
    desc: Build the production Docker image
    cmds:
      - docker build -f deploy/Dockerfile -t {{.IMAGE_NAME}}:dev .

  fly-deploy:
    desc: Deploy to Fly.io (requires FLY_API_TOKEN or a logged-in flyctl)
    cmds:
      - flyctl deploy --config deploy/fly.toml --dockerfile deploy/Dockerfile --remote-only

  ci:
    desc: Run the full CI pipeline (tidy → lint → test → build)
    cmds:
      - task: tidy
      - task: lint
      - task: test
      - task: build
